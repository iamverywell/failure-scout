<svg xmlns="http://www.w3.org/2000/svg" width="1810" height="1212" viewBox="0 0 1810 1212"><defs><marker id="a222222" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker><marker id="s222222" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#222222"/></marker><marker id="ae1653a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e1653a"/></marker><marker id="se1653a" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#e1653a"/></marker><marker id="a6f8fd0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f8fd0"/></marker><marker id="s6f8fd0" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#6f8fd0"/></marker><marker id="ad06a7f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d06a7f"/></marker><marker id="sd06a7f" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d06a7f"/></marker><marker id="a8a8a8a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="s8a8a8a" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8a8a8a"/></marker></defs><rect x="1" y="1" width="1808" height="1210" fill="#fffdf8" stroke="#d89a00" stroke-width="3"/><text x="905.0" y="90" font-family="Helvetica" font-size="48" font-weight="bold" fill="#111" text-anchor="middle">Trial Failure Scout: framework</text><rect x="43" y="153" width="380" height="74" rx="12" fill="#00000018"/><rect x="40" y="150" width="380" height="74" rx="12" fill="#d9ead3" stroke="#82a96f" stroke-width="1.5"/><text x="230.0" y="199" font-family="Helvetica" font-size="32" font-weight="bold" fill="#111" text-anchor="middle">WatchProfile</text><rect x="40" y="224" width="380" height="342" rx="0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/><text x="58" y="270" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Failure types</text><text x="78" y="296" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">trial failure, clinical hold,</text><text x="78" y="322" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">CRL, business discontinuation</text><text x="58" y="374" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Scope set in the prompts</text><text x="78" y="400" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">drugs and biologics, all areas</text><text x="78" y="426" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">and phases, date window</text><rect x="493" y="153" width="380" height="74" rx="12" fill="#00000018"/><rect x="490" y="150" width="380" height="74" rx="12" fill="#cf98e3" stroke="#9a73b0" stroke-width="1.5"/><text x="680.0" y="199" font-family="Helvetica" font-size="32" font-weight="bold" fill="#111" text-anchor="middle">Fetch</text><rect x="490" y="224" width="380" height="342" rx="0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/><text x="508" y="270" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Sources</text><text x="528" y="296" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">ClinicalTrials.gov, RSS feeds,</text><text x="528" y="322" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">5 fixed Google News queries</text><text x="508" y="374" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Agent adds searches</text><text x="528" y="400" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">for thin event types,</text><text x="528" y="426" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">≤ 2 with results</text><text x="508" y="478" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Empty result</text><text x="528" y="504" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">new words, ≤ 3 empty per source</text><rect x="943" y="153" width="380" height="74" rx="12" fill="#00000018"/><rect x="940" y="150" width="380" height="74" rx="12" fill="#fcc131" stroke="#c9910a" stroke-width="1.5"/><text x="1130.0" y="199" font-family="Helvetica" font-size="32" font-weight="bold" fill="#111" text-anchor="middle">Dedupe</text><rect x="940" y="224" width="380" height="342" rx="0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/><text x="958" y="270" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Same URL kept once</text><text x="958" y="322" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Seen URLs skipped</text><text x="978" y="348" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">from all earlier runs</text><text x="958" y="400" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• ≤ 500 new items per run</text><text x="978" y="426" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">the rest wait for the next run</text><rect x="1393" y="153" width="380" height="74" rx="12" fill="#00000018"/><rect x="1390" y="150" width="380" height="74" rx="12" fill="#fcc131" stroke="#c9910a" stroke-width="1.5"/><text x="1580.0" y="199" font-family="Helvetica" font-size="32" font-weight="bold" fill="#111" text-anchor="middle">Classify</text><rect x="1390" y="224" width="380" height="342" rx="0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/><text x="1408" y="270" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• 5 items per call</text><text x="1428" y="296" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">agent</text><text x="1408" y="348" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Structured output</text><text x="1428" y="374" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">failure type, fields,</text><text x="1428" y="400" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">verbatim quote, confidence</text><rect x="43" y="689" width="380" height="74" rx="12" fill="#00000018"/><rect x="40" y="686" width="380" height="74" rx="12" fill="#fcc131" stroke="#c9910a" stroke-width="1.5"/><text x="230.0" y="735" font-family="Helvetica" font-size="32" font-weight="bold" fill="#111" text-anchor="middle">Verify</text><rect x="40" y="760" width="380" height="342" rx="0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/><text x="58" y="806" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Quotes the source</text><text x="78" y="832" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">not verbatim → confidence ≤ 40</text><text x="58" y="884" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Verify with ClinicalTrials.gov</text><text x="78" y="910" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">status, why stopped;</text><text x="78" y="936" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">conflict flagged</text><rect x="493" y="689" width="380" height="74" rx="12" fill="#00000018"/><rect x="490" y="686" width="380" height="74" rx="12" fill="#d9ead3" stroke="#82a96f" stroke-width="1.5"/><text x="680.0" y="735" font-family="Helvetica" font-size="32" font-weight="bold" fill="#111" text-anchor="middle">Store</text><rect x="490" y="760" width="380" height="342" rx="0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/><text x="508" y="806" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• SQLite</text><text x="528" y="832" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">runs, seen items, events, edits</text><text x="508" y="884" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Same key → one row</text><text x="528" y="910" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">NCT id, else drug + sponsor</text><text x="528" y="936" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">+ type, else URL</text><text x="508" y="988" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Higher confidence wins</text><text x="528" y="1014" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">a later report replaces fields</text><text x="528" y="1040" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">only if more confident</text><rect x="943" y="689" width="380" height="74" rx="12" fill="#00000018"/><rect x="940" y="686" width="380" height="74" rx="12" fill="#fcc131" stroke="#c9910a" stroke-width="1.5"/><text x="1130.0" y="735" font-family="Helvetica" font-size="32" font-weight="bold" fill="#111" text-anchor="middle">Merge</text><rect x="940" y="760" width="380" height="342" rx="0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/><text x="958" y="806" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Rule merge</text><text x="978" y="832" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">same drug + company,</text><text x="978" y="858" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">within 30 days</text><text x="958" y="910" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Agent merge</text><text x="978" y="936" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">groups reports in</text><text x="978" y="962" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">14-day windows</text><text x="958" y="1014" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Different NCT ids</text><text x="978" y="1040" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">never merged; duplicates kept</text><text x="978" y="1066" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">with merged_into</text><rect x="1393" y="689" width="380" height="74" rx="12" fill="#00000018"/><rect x="1390" y="686" width="380" height="74" rx="12" fill="#d9ead3" stroke="#82a96f" stroke-width="1.5"/><text x="1580.0" y="735" font-family="Helvetica" font-size="32" font-weight="bold" fill="#111" text-anchor="middle">Dashboard</text><rect x="1390" y="760" width="380" height="342" rx="0" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/><text x="1408" y="806" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Google Sheet</text><text x="1428" y="832" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">pull human edits first, then</text><text x="1428" y="858" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">push events, companies, monthly</text><text x="1408" y="910" font-family="Helvetica" font-size="22" font-weight="bold" fill="#111" text-anchor="start">• Dashboard tab</text><text x="1428" y="936" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">KPIs, monthly chart,</text><text x="1428" y="962" font-family="Helvetica" font-size="19" font-weight="normal" fill="#555" text-anchor="start">company chart, latest 30 events</text><path d="M424.0,358.0 L473.0,358.0" fill="none" stroke="#222" stroke-width="3.6" stroke-linecap="round"/><path d="M486.0,358.0 L469.8,349.9 L469.8,366.1 z" fill="#222"/><path d="M424.0,894.0 L473.0,894.0" fill="none" stroke="#222" stroke-width="3.6" stroke-linecap="round"/><path d="M486.0,894.0 L469.8,885.9 L469.8,902.1 z" fill="#222"/><path d="M874.0,358.0 L923.0,358.0" fill="none" stroke="#222" stroke-width="3.6" stroke-linecap="round"/><path d="M936.0,358.0 L919.8,349.9 L919.8,366.1 z" fill="#222"/><path d="M874.0,894.0 L923.0,894.0" fill="none" stroke="#222" stroke-width="3.6" stroke-linecap="round"/><path d="M936.0,894.0 L919.8,885.9 L919.8,902.1 z" fill="#222"/><path d="M1324.0,358.0 L1373.0,358.0" fill="none" stroke="#222" stroke-width="3.6" stroke-linecap="round"/><path d="M1386.0,358.0 L1369.8,349.9 L1369.8,366.1 z" fill="#222"/><path d="M1324.0,894.0 L1373.0,894.0" fill="none" stroke="#222" stroke-width="3.6" stroke-linecap="round"/><path d="M1386.0,894.0 L1369.8,885.9 L1369.8,902.1 z" fill="#222"/><path d="M1580.0,570.0 L1580.0,626.0 L230.0,626.0 L230.0,669.0" fill="none" stroke="#222" stroke-width="3.6" stroke-linecap="round"/><path d="M230.0,682.0 L238.1,665.8 L221.9,665.8 z" fill="#222"/><path d="M1580.0,1106.0 L1580.0,1116.0 M1580.0,1123.0 L1580.0,1133.0 M1580.0,1140.0 L1580.0,1147.0 M1580.0,1147.0 L1570.0,1147.0 M1563.0,1147.0 L1553.0,1147.0 M1546.0,1147.0 L1536.0,1147.0 M1529.0,1147.0 L1519.0,1147.0 M1512.0,1147.0 L1502.0,1147.0 M1495.0,1147.0 L1485.0,1147.0 M1478.0,1147.0 L1468.0,1147.0 M1461.0,1147.0 L1451.0,1147.0 M1444.0,1147.0 L1434.0,1147.0 M1427.0,1147.0 L1417.0,1147.0 M1410.0,1147.0 L1400.0,1147.0 M1393.0,1147.0 L1383.0,1147.0 M1376.0,1147.0 L1366.0,1147.0 M1359.0,1147.0 L1349.0,1147.0 M1342.0,1147.0 L1332.0,1147.0 M1325.0,1147.0 L1315.0,1147.0 M1308.0,1147.0 L1298.0,1147.0 M1291.0,1147.0 L1281.0,1147.0 M1274.0,1147.0 L1264.0,1147.0 M1257.0,1147.0 L1247.0,1147.0 M1240.0,1147.0 L1230.0,1147.0 M1223.0,1147.0 L1213.0,1147.0 M1206.0,1147.0 L1196.0,1147.0 M1189.0,1147.0 L1179.0,1147.0 M1172.0,1147.0 L1162.0,1147.0 M1155.0,1147.0 L1145.0,1147.0 M1138.0,1147.0 L1128.0,1147.0 M1121.0,1147.0 L1111.0,1147.0 M1104.0,1147.0 L1094.0,1147.0 M1087.0,1147.0 L1077.0,1147.0 M1070.0,1147.0 L1060.0,1147.0 M1053.0,1147.0 L1043.0,1147.0 M1036.0,1147.0 L1026.0,1147.0 M1019.0,1147.0 L1009.0,1147.0 M1002.0,1147.0 L992.0,1147.0 M985.0,1147.0 L975.0,1147.0 M968.0,1147.0 L958.0,1147.0 M951.0,1147.0 L941.0,1147.0 M934.0,1147.0 L924.0,1147.0 M917.0,1147.0 L907.0,1147.0 M900.0,1147.0 L890.0,1147.0 M883.0,1147.0 L873.0,1147.0 M866.0,1147.0 L856.0,1147.0 M849.0,1147.0 L839.0,1147.0 M832.0,1147.0 L822.0,1147.0 M815.0,1147.0 L805.0,1147.0 M798.0,1147.0 L788.0,1147.0 M781.0,1147.0 L771.0,1147.0 M764.0,1147.0 L754.0,1147.0 M747.0,1147.0 L737.0,1147.0 M730.0,1147.0 L720.0,1147.0 M713.0,1147.0 L703.0,1147.0 M696.0,1147.0 L686.0,1147.0 M680.0,1147.0 L680.0,1137.0 M680.0,1130.0 L680.0,1120.0 " fill="none" stroke="#e1653a" stroke-width="3" stroke-linecap="round"/><path d="M680.0,1108.0 L672.5,1123.0 L687.5,1123.0 z" fill="#e1653a"/><text x="1130.0" y="1181" font-family="Helvetica" font-size="21" font-weight="bold" fill="#e1653a" text-anchor="middle">human edits pulled back into SQLite</text></svg>